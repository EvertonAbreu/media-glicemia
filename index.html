<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle Glicêmico - DiabCare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🩸 DiabCare - Sistema de Controle Glicêmico</h1>
            <p>Monitore sua glicemia e insulina de forma eficiente</p>
        </div>
        
        <div class="content">
            <div class="stats">
                <div class="stat-card">
                    <h3>Total de Medições</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <h3>Média de Glicemia</h3>
                    <div class="value" id="avgGlucose">0</div>
                </div>
                <div class="stat-card">
                    <h3>Dias Monitorados</h3>
                    <div class="value" id="uniqueDays">0</div>
                </div>
            </div>

            <div class="form-section">
                <h2 style="margin-bottom: 20px;">📝 Nova Medição</h2>
                <form id="glucoseForm">
                    <div class="form-group">
                        <label>Data e Hora:</label>
                        <input type="datetime-local" id="datetime" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Glicemia (mg/dL):</label>
                        <input type="number" id="glucose" required step="1" placeholder="Ex: 120">
                    </div>
                    
                    <div class="form-group" id="insulinGroup" style="display: none;">
                        <label>Insulina Aplicada (unidades):</label>
                        <input type="number" id="insulin" step="0.5" placeholder="Quantidade de insulina">
                    </div>
                    
                    <div class="form-group">
                        <label>Observações:</label>
                        <textarea id="notes" rows="3" placeholder="Observações adicionais..."></textarea>
                    </div>
                    
                    <button type="submit">💾 Salvar Medição</button>
                </form>
            </div>

            <div class="records-section">
                <h2 style="margin-bottom: 20px;">📊 Histórico de Medições</h2>
                
                <div class="filters">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar por data..." class="search-input">
                    <select id="filterStatus">
                        <option value="all">Todos os status</option>
                        <option value="high">Alta (>140)</option>
                        <option value="normal">Normal (70-140)</option>
                        <option value="low">Baixa (<70)</option>
                    </select>
                    <button id="clearFiltersBtn" style="width: auto; padding: 12px 20px;">Limpar Filtros</button>
                    <button id="exportBtn" style="width: auto; padding: 12px 20px; background: #28a745;">📥 Exportar Dados</button>
                </div>
                
                <div class="records-table">
                    <table id="recordsTable">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Dia da Semana</th>
                                <th>Glicemia</th>
                                <th>Status</th>
                                <th>Insulina</th>
                                <th>Observações</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody">
                            <tr><td colspan="7" style="text-align: center;">Nenhum registro encontrado</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
